<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sarcasm Quiz</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 60px;
        }

        .question-box {
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
            background-color: #1e1e1e;
            width: 60%;
            font-size: 1.4rem;
        }

        button {
            padding: 10px 30px;
            margin: 10px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
        }

        button:hover {
            background-color: #555;
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.2rem;
        }

        .menu-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .menu-button {
            background-color: #333;
            color: white;
            padding: 10px 16px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            background-color: #222;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            z-index: 11;
        }

        .menu-dropdown a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .menu-dropdown a:hover {
            background-color: #444;
        }

        .menu-container:hover .menu-dropdown {
            display: block;
        }
    </style>
</head>
<body>

<!-- Menü -->
<div class="menu-container">
    <button class="menu-button">☰ Menu</button>
    <div class="menu-dropdown">
        <a href="/">Detect Sarcasm</a>
        <a href="/quiz">Sarcasm Quiz</a>
    </div>
</div>

<h1>Sarcasm Quiz</h1>

{% if result.text != "Quiz complete! Refresh to restart." %}
    <div class="question-box">
        <p><strong>Sentence:</strong> {{ result.text }}</p>
        <form method="POST">
            <input type="hidden" name="current" value="{{ result.text }}">
            <input type="hidden" name="correct" value="{{ result.correct }}">
            <input type="hidden" name="confidence" value="{{ '%.2f' % result.confidence }}">
            <button type="submit" name="answer" value="1">Sarcastic</button>
            <button type="submit" name="answer" value="0">Not Sarcastic</button>
        </form>
    </div>
{% else %}
    <p>{{ result.text }}</p>
{% endif %}

{% if feedback %}
    <div class="feedback">{{ feedback }}</div>
    <div class="feedback">Confidence: {{ '%.2f' % result.confidence }}%</div>

    <form method="POST" action="/quiz-feedback">
        <input type="hidden" name="sentence" value="{{ result.text }}">
        <input type="hidden" name="prediction" value="{{ result.prediction }}">
        <input type="hidden" name="confidence" value="{{ '%.2f' % result.confidence }}">
        <p>Was this prediction correct?</p>
        <button name="feedback" value="yes">Yes</button>
        <button name="feedback" value="no">No</button>
    </form>
{% endif %}

</body>
</html>
