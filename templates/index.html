<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sarcasm Detector</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            font-size: 1.2rem;
            padding: 12px;
            border-radius: 10px;
            border: none;
            resize: none;
            background-color: #1e1e1e;
            color: white;
        }

        button {
            margin-top: 20px;
            padding: 12px 40px;
            font-size: 1rem;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .output-box {
            margin-top: 40px;
            padding: 20px;
            border-radius: 12px;
            background-color: #1c1c1c;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
            text-align: left;
            font-size: 1.1rem;
        }

        .menu-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .menu-button {
            background-color: #333;
            color: white;
            padding: 10px 16px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            background-color: #222;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            z-index: 11;
        }

        .menu-dropdown a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .menu-dropdown a:hover {
            background-color: #444;
        }

        .menu-container:hover .menu-dropdown {
            display: block;
        }
    </style>
</head>
<body>


<div class="menu-container">
    <button class="menu-button">☰ Menu</button>
    <div class="menu-dropdown">
        <a href="/">Detect Sarcasm</a>
        <a href="/quiz">Sarcasm Quiz</a>
    </div>
</div>

<div class="container">
    <h1>Sarcasm Detector</h1>

    <form method="POST">
        <textarea name="sentence" placeholder="Write a sentence...">{{ request.form.sentence }}</textarea><br>
        <button type="submit">Detect</button>
    </form>

    {% if result %}
        <div class="output-box">
            <p><strong>Sentence:</strong> {{ result.text if result.text else request.form.sentence }}</p>
            <p><strong>Sarcasm:</strong> {{ result.sarcasm_en }}</p>
            <p><strong>Confidence:</strong> {{ result.confidence }}%</p>
        </div>

        <form method="POST" action="/feedback">
            <input type="hidden" name="sentence" value="{{ result.text }}">
            <input type="hidden" name="prediction" value="{{ result.sarcasm_en }}">
            <input type="hidden" name="confidence" value="{{ result.confidence }}">
            <p>Was this prediction correct?</p>
            <button name="feedback" value="yes">Yes</button>
            <button name="feedback" value="no">No</button>
        </form>
    {% endif %}
</div>

</body>
</html>
